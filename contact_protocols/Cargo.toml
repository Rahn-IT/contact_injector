[package]
name = "contact_protocols"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.41"
http = "1.3.1"
hyper-rustls = "0.27.7"
hyper-util = "0.1.16"
libdav = "0.9.3"
nom = "8.0.0"
reqwest = { version = "0.12.23", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = "1.47.1"
tower-http = { version = "0.6.6", features = ["auth"] }
