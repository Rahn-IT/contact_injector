[package]
name = "contact_injector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
chrono = "0.4.42"
http = "1.4.0"
mime = "0.3.17"
minijinja = "2.13.0"
minijinja-embed = "2.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
contact_protocols = { path = "../contact_protocols" }

[build-dependencies]
minijinja-embed = "2.13.0"
