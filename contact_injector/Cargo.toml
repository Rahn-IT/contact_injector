[package]
name = "contact_injector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
chrono = "0.4.41"
http = "1.3.1"
mime = "0.3.17"
minijinja = "2.12.0"
minijinja-embed = "2.12.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
contact_protocols = { path = "../contact_protocols" }

[build-dependencies]
minijinja-embed = "2.12.0"
