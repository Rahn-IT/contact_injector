[package]
name = "contact_injector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
http = "1.4.2"
mime = "0.3.17"
minijinja = "2.21.0"
minijinja-embed = "2.21.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
contact_protocols = { path = "../contact_protocols" }

[build-dependencies]
minijinja-embed = "2.21.0"
