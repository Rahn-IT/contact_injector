{% extends 'layout.html' %} {% block title %} Sources {% endblock %} {% block
content %}
<div>
    <a class="btn" href="/sources/new/carddav">New Carddav Source</a>
</div>
<table class="table">
    <thead>
        <tr>
            <th>Name</th>
        </tr>
    </thead>
    <tbody>
        {% for source in sources %}
        <tr>
            <td>{{ source.name }}</td>
            <td>
                <div class="actions">
                    <div>
                        <a
                            href="/sources/edit/{{source.source_type}}/{{source.id}}"
                            >✏️</a
                        >
                        <span class="tooltip">Edit</span>
                    </div>
                    <div>
                        <form
                            method="POST"
                            action="/sources/delete/{{source.id}}"
                            style="display: inline"
                        >
                            <button
                                type="submit"
                                style="
                                    background: none;
                                    border: none;
                                    cursor: pointer;
                                    font-size: inherit;
                                "
                                onclick="return confirm('Are you sure you want to delete the source \'{{source.name}}\'? This action cannot be undone.');"
                            >
                                🗑️
                            </button>
                        </form>
                        <span class="tooltip">Delete</span>
                    </div>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
